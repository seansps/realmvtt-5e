<script>
  // Every handler in this file follows the same rule as showHideFields():
  // collect only the keys whose value would actually CHANGE, then skip the API
  // call entirely when nothing did. Writes are what re-render the sheet, and a
  // re-render re-fires onload — an unconditional write is how a handler turns
  // into a loop, and how a list of rows turns into a write storm that trips the
  // client's per-record rate limit.
  function onMaxUsesChanged(value) {
    const itemDataPath = getNearestParentDataPath(dataPath);
    const item = itemDataPath ? api.getValue(itemDataPath) : record;
    const dataPrefix = itemDataPath ? `${itemDataPath}.data` : "data";
    const fieldsPath = itemDataPath ? `${itemDataPath}.fields` : "fields";
    const maxUses = parseInt(value, 10);
    const showLabel = !isNaN(maxUses) && maxUses > 1;
    const uses = parseInt(item.data?.usesRemaining, 10);
    const valuesToSet = {};
    if (item.fields?.usesRemainingLabel?.hidden !== !showLabel) {
      valuesToSet[`${fieldsPath}.usesRemainingLabel.hidden`] = !showLabel;
    }
    if (showLabel) {
      const label = `Uses: ${!isNaN(uses) ? uses : maxUses}`;
      if (item.data?.usesRemainingLabel !== label) {
        valuesToSet[`${dataPrefix}.usesRemainingLabel`] = label;
      }
    }
    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onUsesRemainingChanged(value) {
    const itemDataPath = getNearestParentDataPath(dataPath);
    const item = itemDataPath ? api.getValue(itemDataPath) : record;
    const dataPrefix = itemDataPath ? `${itemDataPath}.data` : "data";
    const maxUses = parseInt(item.data?.maxUses, 10);
    if (!isNaN(maxUses) && maxUses > 1) {
      const uses = parseInt(value, 10);
      if (!isNaN(uses)) {
        const label = `Uses: ${uses}`;
        if (item.data?.usesRemainingLabel !== label) {
          api.setValue(`${dataPrefix}.usesRemainingLabel`, label);
        }
      }
    }
  }

  // Spell scrolls: choosing the spell, or changing the level it is scribed at,
  // re-derives the scroll's rarity / save DC / attack bonus from
  // TABLE: SPELL SCROLLS and rebuilds its Spells tab to hold that one spell.
  // applyScrollDefaults (commonScript) writes only what actually differs, so
  // these are safe to fire on every change.
  function onScrollSpellChanged(value) {
    const itemDataPath = getNearestParentDataPath(dataPath);
    let picked = null;
    try {
      picked = value ? JSON.parse(value) : null;
    } catch (e) {
      picked = null;
    }
    // The dropdown stores only { _id, name } — no level, no description. The
    // Spells-tab row needs the WHOLE spell record (a row IS the spell), so
    // re-fetch it before deriving anything. Without this the row lands with no
    // data and its level button renders blank.
    if (!picked?._id) {
      const valuesToSet = applyScrollDefaults(itemDataPath, {});
      if (Object.keys(valuesToSet).length > 0) api.setValues(valuesToSet);
      return;
    }
    api.getRecord("spells", picked._id, (spell) => {
      if (!spell) return;
      // The newly chosen spell's level drives everything, so a stale one can't
      // survive a swap. Handing it to applyScrollDefaults rather than writing it
      // here keeps the whole derivation on one level AND keeps the handler
      // silent when nothing actually changed.
      const raw = spell?.data?.level;
      const lvl = raw === "Cantrip" ? 0 : parseInt(raw, 10);
      const valuesToSet = applyScrollDefaults(
        itemDataPath,
        {},
        spell,
        isNaN(lvl) ? undefined : lvl,
      );
      if (Object.keys(valuesToSet).length > 0) api.setValues(valuesToSet);
    });
  }

  function onScrollLevelChanged() {
    const itemDataPath = getNearestParentDataPath(dataPath);
    const valuesToSet = applyScrollDefaults(itemDataPath, {});
    if (Object.keys(valuesToSet).length > 0) api.setValues(valuesToSet);
  }

  function showHideFields(recordOverride = undefined) {
    record = recordOverride || record;
    const itemDataPath = getNearestParentDataPath(dataPath);
    const item = itemDataPath ? api.getValue(itemDataPath) : record;
    const dataPrefix = itemDataPath ? `${itemDataPath}.data` : "data";
    const fieldsPath = itemDataPath ? `${itemDataPath}.fields` : "fields";

    const valuesToSet = {};

    const typeStr = item.data?.type || "";
    const subtype = item.data?.subtype || "";
    const weaponProperties = item.data?.weaponProperties || [];
    const isConsumable = item.data?.consumable || false;
    const hasUseBtn = item.data?.hasUseBtn || false;

    const isWeapon = typeStr === "melee weapon" || typeStr === "ranged weapon";
    const isArmorOrShield = typeStr === "shield" || typeStr === "armor";
    const isArmor = typeStr === "armor";
    const isPack = typeStr === "pack";
    const isScroll = subtype.toLowerCase().includes("scroll");
    const hasRange =
      weaponProperties.includes("Range") ||
      weaponProperties.includes("Thrown") ||
      weaponProperties.includes("Ammunition");
    const hasAmmo = weaponProperties.includes("Ammunition");
    const hasVersatile = weaponProperties.includes("Versatile");

    if (isWeapon && item.fields?.damage?.hidden !== false) {
      valuesToSet[`${fieldsPath}.damage.hidden`] = false;
    } else if (!isWeapon && item.fields?.damage?.hidden !== true) {
      valuesToSet[`${fieldsPath}.damage.hidden`] = true;
    }

    if (isWeapon && item.fields?.weaponType?.hidden !== false) {
      valuesToSet[`${fieldsPath}.weaponType.hidden`] = false;
    } else if (!isWeapon && item.fields?.weaponType?.hidden !== true) {
      valuesToSet[`${fieldsPath}.weaponType.hidden`] = true;
    }

    if (isWeapon && item.fields?.weaponMastery?.hidden !== false) {
      valuesToSet[`${fieldsPath}.weaponMastery.hidden`] = false;
    } else if (!isWeapon && item.fields?.weaponMastery?.hidden !== true) {
      valuesToSet[`${fieldsPath}.weaponMastery.hidden`] = true;
    }

    if (isWeapon && item.fields?.weaponProperties?.hidden !== false) {
      valuesToSet[`${fieldsPath}.weaponProperties.hidden`] = false;
    } else if (!isWeapon && item.fields?.weaponProperties?.hidden !== true) {
      valuesToSet[`${fieldsPath}.weaponProperties.hidden`] = true;
    }

    if (isArmorOrShield && item.fields?.armorClass?.hidden !== false) {
      valuesToSet[`${fieldsPath}.armorClass.hidden`] = false;
    } else if (!isArmorOrShield && item.fields?.armorClass?.hidden !== true) {
      valuesToSet[`${fieldsPath}.armorClass.hidden`] = true;
    }

    if (isArmor && item.fields?.armorCategory?.hidden !== false) {
      valuesToSet[`${fieldsPath}.armorCategory.hidden`] = false;
    } else if (!isArmor && item.fields?.armorCategory?.hidden !== true) {
      valuesToSet[`${fieldsPath}.armorCategory.hidden`] = true;
    }

    if (isArmor && item.fields?.addDex?.hidden !== false) {
      valuesToSet[`${fieldsPath}.addDex.hidden`] = false;
    } else if (!isArmor && item.fields?.addDex?.hidden !== true) {
      valuesToSet[`${fieldsPath}.addDex.hidden`] = true;
    }

    if (isArmor && item.fields?.maxDex?.hidden !== false) {
      valuesToSet[`${fieldsPath}.maxDex.hidden`] = false;
    } else if (!isArmor && item.fields?.maxDex?.hidden !== true) {
      valuesToSet[`${fieldsPath}.maxDex.hidden`] = true;
    }

    if (isArmor && item.fields?.strength?.hidden !== false) {
      valuesToSet[`${fieldsPath}.strength.hidden`] = false;
    } else if (!isArmor && item.fields?.strength?.hidden !== true) {
      valuesToSet[`${fieldsPath}.strength.hidden`] = true;
    }

    if (isArmor && item.fields?.stealth?.hidden !== false) {
      valuesToSet[`${fieldsPath}.stealth.hidden`] = false;
    } else if (!isArmor && item.fields?.stealth?.hidden !== true) {
      valuesToSet[`${fieldsPath}.stealth.hidden`] = true;
    }

    if (
      !isWeapon &&
      !isArmorOrShield &&
      !isPack &&
      item.fields?.consumable?.hidden !== false
    ) {
      valuesToSet[`${fieldsPath}.consumable.hidden`] = false;
    } else if (
      (isWeapon || isArmorOrShield || isPack) &&
      item.fields?.consumable?.hidden !== true
    ) {
      valuesToSet[`${fieldsPath}.consumable.hidden`] = true;
    }

    if (isPack && item.fields?.itemListLabel?.hidden !== false) {
      valuesToSet[`${fieldsPath}.itemListLabel.hidden`] = false;
    } else if (!isPack && item.fields?.itemListLabel?.hidden !== true) {
      valuesToSet[`${fieldsPath}.itemListLabel.hidden`] = true;
    }

    if (isPack && item.fields?.items?.hidden !== false) {
      valuesToSet[`${fieldsPath}.items.hidden`] = false;
    } else if (!isPack && item.fields?.items?.hidden !== true) {
      valuesToSet[`${fieldsPath}.items.hidden`] = true;
    }

    if (isPack && item.fields?.cp?.hidden !== false) {
      valuesToSet[`${fieldsPath}.cp.hidden`] = false;
    } else if (!isPack && item.fields?.cp?.hidden !== true) {
      valuesToSet[`${fieldsPath}.cp.hidden`] = true;
    }

    if (isPack && item.fields?.sp?.hidden !== false) {
      valuesToSet[`${fieldsPath}.sp.hidden`] = false;
    } else if (!isPack && item.fields?.sp?.hidden !== true) {
      valuesToSet[`${fieldsPath}.sp.hidden`] = true;
    }

    if (isPack && item.fields?.ep?.hidden !== false) {
      valuesToSet[`${fieldsPath}.ep.hidden`] = false;
    } else if (!isPack && item.fields?.ep?.hidden !== true) {
      valuesToSet[`${fieldsPath}.ep.hidden`] = true;
    }

    if (isPack && item.fields?.gp?.hidden !== false) {
      valuesToSet[`${fieldsPath}.gp.hidden`] = false;
    } else if (!isPack && item.fields?.gp?.hidden !== true) {
      valuesToSet[`${fieldsPath}.gp.hidden`] = true;
    }

    if (isPack && item.fields?.pp?.hidden !== false) {
      valuesToSet[`${fieldsPath}.pp.hidden`] = false;
    } else if (!isPack && item.fields?.pp?.hidden !== true) {
      valuesToSet[`${fieldsPath}.pp.hidden`] = true;
    }

    if (!isPack && item.fields?.rarity?.hidden !== false) {
      valuesToSet[`${fieldsPath}.rarity.hidden`] = false;
    } else if (isPack && item.fields?.rarity?.hidden !== true) {
      valuesToSet[`${fieldsPath}.rarity.hidden`] = true;
    }

    if (!isPack && item.fields?.attunement?.hidden !== false) {
      valuesToSet[`${fieldsPath}.attunement.hidden`] = false;
    } else if (isPack && item.fields?.attunement?.hidden !== true) {
      valuesToSet[`${fieldsPath}.attunement.hidden`] = true;
    }

    if (!isPack && item.fields?.hasUseBtn?.hidden !== false) {
      valuesToSet[`${fieldsPath}.hasUseBtn.hidden`] = false;
    } else if (isPack && item.fields?.hasUseBtn?.hidden !== true) {
      valuesToSet[`${fieldsPath}.hasUseBtn.hidden`] = true;
    }

    // Show usesRemaining and maxUses when Consumable OR "Has Use" is checked.
    // "Has Use" (not consumable) is used for magic items with charges.
    const showUses = isConsumable || hasUseBtn;
    if (showUses && item.fields?.usesRemaining?.hidden !== false) {
      valuesToSet[`${fieldsPath}.usesRemaining.hidden`] = false;
    } else if (!showUses && item.fields?.usesRemaining?.hidden !== true) {
      valuesToSet[`${fieldsPath}.usesRemaining.hidden`] = true;
    }

    if (showUses && item.fields?.maxUses?.hidden !== false) {
      valuesToSet[`${fieldsPath}.maxUses.hidden`] = false;
    } else if (!showUses && item.fields?.maxUses?.hidden !== true) {
      valuesToSet[`${fieldsPath}.maxUses.hidden`] = true;
    }

    // "Prompt Charges" only makes sense alongside tracked uses.
    if (showUses && item.fields?.promptCharges?.hidden !== false) {
      valuesToSet[`${fieldsPath}.promptCharges.hidden`] = false;
    } else if (!showUses && item.fields?.promptCharges?.hidden !== true) {
      valuesToSet[`${fieldsPath}.promptCharges.hidden`] = true;
    }

    // "Has Spells" likewise only applies to a charged item, and it gates the
    // Spells tab (the same tabs.<Name>.hidden mechanism used elsewhere).
    if (showUses && item.fields?.hasSpells?.hidden !== false) {
      valuesToSet[`${fieldsPath}.hasSpells.hidden`] = false;
    } else if (!showUses && item.fields?.hasSpells?.hidden !== true) {
      valuesToSet[`${fieldsPath}.hasSpells.hidden`] = true;
    }

    const hasSpells = showUses && item.data?.hasSpells === true;
    const tabsPath = itemDataPath ? `${itemDataPath}.tabs` : "tabs";
    if (hasSpells && item.tabs?.Spells?.hidden !== false) {
      valuesToSet[`${tabsPath}.Spells.hidden`] = false;
    } else if (!hasSpells && item.tabs?.Spells?.hidden !== true) {
      valuesToSet[`${tabsPath}.Spells.hidden`] = true;
    }

    if (isScroll && item.fields?.spell?.hidden !== false) {
      valuesToSet[`${fieldsPath}.spell.hidden`] = false;
    } else if (!isScroll && item.fields?.spell?.hidden !== true) {
      valuesToSet[`${fieldsPath}.spell.hidden`] = true;
    }

    if (isScroll && item.fields?.spellLevel?.hidden !== false) {
      valuesToSet[`${fieldsPath}.spellLevel.hidden`] = false;
    } else if (!isScroll && item.fields?.spellLevel?.hidden !== true) {
      valuesToSet[`${fieldsPath}.spellLevel.hidden`] = true;
    }

    if ((isConsumable || hasUseBtn) && item.fields?.effects?.hidden !== false) {
      valuesToSet[`${fieldsPath}.effects.hidden`] = false;
    } else if (
      !isConsumable &&
      !hasUseBtn &&
      item.fields?.effects?.hidden !== true
    ) {
      valuesToSet[`${fieldsPath}.effects.hidden`] = true;
    }

    if ((isConsumable || hasUseBtn) && item.fields?.healing?.hidden !== false) {
      valuesToSet[`${fieldsPath}.healing.hidden`] = false;
    } else if (
      !isConsumable &&
      !hasUseBtn &&
      item.fields?.healing?.hidden !== true
    ) {
      valuesToSet[`${fieldsPath}.healing.hidden`] = true;
    }

    if (
      (isConsumable || hasUseBtn) &&
      item.fields?.useDamage?.hidden !== false
    ) {
      valuesToSet[`${fieldsPath}.useDamage.hidden`] = false;
    } else if (
      !isConsumable &&
      !hasUseBtn &&
      item.fields?.useDamage?.hidden !== true
    ) {
      valuesToSet[`${fieldsPath}.useDamage.hidden`] = true;
    }

    if (hasRange && item.fields?.normalRange?.hidden !== false) {
      valuesToSet[`${fieldsPath}.normalRange.hidden`] = false;
    } else if (!hasRange && item.fields?.normalRange?.hidden !== true) {
      valuesToSet[`${fieldsPath}.normalRange.hidden`] = true;
    }

    if (hasRange && item.fields?.maxRange?.hidden !== false) {
      valuesToSet[`${fieldsPath}.maxRange.hidden`] = false;
    } else if (!hasRange && item.fields?.maxRange?.hidden !== true) {
      valuesToSet[`${fieldsPath}.maxRange.hidden`] = true;
    }

    if (hasRange && item.fields?.rangeLabel?.hidden !== false) {
      valuesToSet[`${fieldsPath}.rangeLabel.hidden`] = false;
    } else if (!hasRange && item.fields?.rangeLabel?.hidden !== true) {
      valuesToSet[`${fieldsPath}.rangeLabel.hidden`] = true;
    }

    if (hasAmmo && item.fields?.ammoType?.hidden !== false) {
      valuesToSet[`${fieldsPath}.ammoType.hidden`] = false;
    } else if (!hasAmmo && item.fields?.ammoType?.hidden !== true) {
      valuesToSet[`${fieldsPath}.ammoType.hidden`] = true;
    }

    if (hasVersatile && item.fields?.versatileDamage?.hidden !== false) {
      valuesToSet[`${fieldsPath}.versatileDamage.hidden`] = false;
    } else if (!hasVersatile && item.fields?.versatileDamage?.hidden !== true) {
      valuesToSet[`${fieldsPath}.versatileDamage.hidden`] = true;
    }

    // Curse box (GM only, identified only) — only for magic items.
    // A weapon/armor/etc. can be magical without being Type "magic item"
    // (e.g. a +1 or cursed sword). Rarity is the definitive signal: any rarity
    // set — even "common" — means the item is magic; mundane gear leaves rarity
    // blank. Also treat anything typed as a "magic item" as magic.
    const rarityStr = (item.data?.rarity || "").toString().trim();
    const isMagic = rarityStr !== "" || typeStr === "magic item";
    if (isMagic && item.fields?.curseBox?.hidden !== false) {
      valuesToSet[`${fieldsPath}.curseBox.hidden`] = false;
    } else if (!isMagic && item.fields?.curseBox?.hidden !== true) {
      valuesToSet[`${fieldsPath}.curseBox.hidden`] = true;
    }

    // Recharge field — only for magic items with charges (Has Use, not Consumable)
    const showRecharge = isMagic && hasUseBtn && !isConsumable;
    if (showRecharge && item.fields?.recharge?.hidden !== false) {
      valuesToSet[`${fieldsPath}.recharge.hidden`] = false;
    } else if (!showRecharge && item.fields?.recharge?.hidden !== true) {
      valuesToSet[`${fieldsPath}.recharge.hidden`] = true;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }
</script>

<div
  style="display: flex; flex-direction: column; width: 100%; margin-bottom: 4px"
>
  <div style="display: flex; gap: 4px">
    <div
      style="width: 125px; height: 125px; min-height: 125px; min-width: 125px"
    >
      <portrait width="125px" height="125px" field="portrait"></portrait>
    </div>
    <div
      style="
        display: flex;
        gap: 4px;
        flex-direction: column;
        width: 100%;
        margin-bottom: 4px;
      "
    >
      <!-- 125px, not 100%: the percentage resolves against this column, whose
           own height is stretched rather than definite, so the panel came up
           short of the portrait beside it. Matching the portrait's fixed size
           keeps the two flush. The box itself collapses when identified, so a
           wrapper div would leave dead space instead. -->
      <box height="125px" field="unidBox" hidewhenidentified="true">
        <div
          style="
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background-color: var(--mantine-color-tertiary-light);
          "
        >
          <label
            hidewhenidentified="true"
            label="Unidentified Item"
            variant="bold"
            textalign="center"
          ></label>
        </div>
      </box>
      <dropdown
        multiselect="1"
        placeholder="Select Type"
        onchange="showHideFields()"
        onload="showHideFields()"
        hidewhenidentified="false"
        field="type"
        label="Type"
        options='[{"label": "Adventuring Gear", "value": "gear"}, {"label": "Melee Weapon", "value": "melee weapon"},
      {"label": "Ranged Weapon", "value": "ranged weapon"}, {"label": "Armor", "value": "armor"}, {"label": "Shield", "value": "shield"},
      {"label": "Tool", "value": "tool"}, {"label": "Magic Item", "value": "magic item"}, {"label": "Item Pack", "value": "pack"}]'
      >
      </dropdown>
      <dropdown
        placeholder="Select Subtype..."
        onchange="showHideFields()"
        field="subtype"
        label="Subtype"
        combo="true"
        hidewhenidentified="false"
        options='[{"label": "Ammunition", "value": "Ammunition"},
    {"label": "Art Object", "value": "Art Object"},
    {"label": "Book", "value": "Book"},
    {"label": "Clothing", "value": "Clothing"},
    {"label": "General", "value": "General"},
    {"label": "Heavy Armor", "value": "Heavy Armor"},
    {"label": "Light Armor", "value": "Light Armor"},
    {"label": "Medium Armor", "value": "Medium Armor"},
    {"label": "Martial Melee Weapon", "value": "Martial Melee Weapon"},
    {"label": "Martial Ranged Weapon", "value": "Martial Ranged Weapon"},
    {"label": "Simple Melee Weapon", "value": "Simple Melee Weapon"},
    {"label": "Simple Ranged Weapon", "value": "Simple Ranged Weapon"},
    {"label": "Rare Melee Weapon", "value": "Rare Melee Weapon"},
    {"label": "Rare Ranged Weapon", "value": "Rare Ranged Weapon"},
    {"label": "Trade Goods", "value": "Trade Goods"},
    {"label": "Tools", "value": "Tools"},
    {"label": "Potion", "value": "Potion"},
    {"label": "Ring", "value": "Ring"},
    {"label": "Rod", "value": "Rod"},
    {"label": "Scroll", "value": "Scroll"},
    {"label": "Staff", "value": "Staff"},
    {"label": "Wand", "value": "Wand"},
    {"label": "Wondrous Item", "value": "Wondrous Item"},
    {"label": "Treasure", "value": "Treasure"}]'
      ></dropdown>
    </div>
  </div>

  <div style="display: flex; flex-direction: row; width: 100%; gap: 8px">
    <stringfield
      width="100%"
      field="cost"
      label="Cost"
      placeholder="Enter cost..."
      hidewhenidentified="false"
    ></stringfield>
    <numberfield
      width="100%"
      field="weight"
      label="Weight"
      placeholder="0"
    ></numberfield>
    <dropdown
      width="100%"
      field="rarity"
      label="Rarity"
      placeholder="--"
      hidewhenidentified="false"
      onchange="showHideFields()"
      options='[{"label": "Common", "value": "common"}, {"label": "Uncommon", "value": "uncommon"}, {"label": "Rare", "value": "rare"}, {"label": "Very Rare", "value": "very rare"}, {"label": "Legendary", "value": "legendary"}, {"label": "Artifact", "value": "artifact"}]'
    >
    </dropdown>
  </div>

  <!-- Other General Properties -->

  <div
    style="
      display: flex;
      flex-direction: row;
      gap: 16px;
      margin-top: 8px;
      margin-bottom: 8px;
    "
  >
    <checkbox
      field="attunement"
      label="Requires Attunement"
      textalign="left"
      size="sm"
      hidewhenidentified="false"
    >
    </checkbox>
    <checkbox
      hidden="false"
      field="hasUseBtn"
      label="Has Use"
      textalign="left"
      size="sm"
      hidewhenidentified="false"
      onchange="showHideFields()"
    ></checkbox>
    <checkbox
      hidden="true"
      field="consumable"
      label="Consumable"
      textalign="left"
      size="sm"
      hidewhenidentified="false"
      onchange="showHideFields()"
    ></checkbox>
  </div>

  <!-- Charges / uses (Consumable or "Has Use") -->

  <div
    style="
      display: flex;
      flex-direction: row;
      width: 100%;
      gap: 8px;
      align-items: center;
    "
  >
    <numberfield
      hidden="true"
      field="usesRemaining"
      label="Uses Remaining"
      placeholder="1"
      width="100%"
      min="0"
      size="sm"
      hidewhenidentified="false"
      onchange="onUsesRemainingChanged(value)"
    ></numberfield>
    <numberfield
      hidden="true"
      field="maxUses"
      label="Max Uses"
      width="100%"
      placeholder="1"
      min="0"
      size="sm"
      hidewhenidentified="false"
      onchange="onMaxUsesChanged(value)"
    ></numberfield>
    <div style="width: 100%">
      <checkbox
        hidden="true"
        field="promptCharges"
        label="Prompt for Charges"
        textalign="left"
        size="sm"
        width="100%"
        hidewhenidentified="false"
      ></checkbox>
      <checkbox
        hidden="true"
        field="hasSpells"
        label="Has Spells"
        textalign="left"
        size="sm"
        width="100%"
        hidewhenidentified="false"
        onchange="showHideFields()"
      ></checkbox>
    </div>
  </div>

  <stringfield
    hidden="true"
    field="recharge"
    label="Recharge"
    description="How many charges recover when recharged. A dice value (e.g. 1d6) is rolled and added; a fixed number (e.g. 1) adds exactly that many; leave blank to recharge to full."
    placeholder="e.g. 1d6, 1, or blank for full"
    width="100%"
    size="sm"
    hidewhenidentified="false"
  ></stringfield>

  <!-- Weapon Properties -->

  <stringfield
    width="100%"
    hidden="true"
    hidewhenidentified="false"
    field="damage"
    label="Damage"
    placeholder="Enter Damage for attacks..."
  ></stringfield>

  <div style="display: flex; flex-direction: row; width: 100%; gap: 8px">
    <dropdown
      width="50%"
      hidden="true"
      hidewhenidentified="false"
      field="weaponType"
      label="Weapon Type"
      placeholder="Select Weapon Type"
      searchable="true"
      options='[{"label": "Club", "value": "Club"}, {"label": "Dagger", "value": "Dagger"},
