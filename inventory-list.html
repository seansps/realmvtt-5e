<script>
  // setTotalWeight now lives in commonScript (rollhandlers/common.js) so both
  // the inventory row and the grid Use handler share one implementation.

  function useItem() {
    // Shared with the grid popover's Use button; implementation lives in
    // commonScript (useInventoryItem).
    const itemDataPath = dataPath.replace(".data.useBtn", "");
    useInventoryItem(itemDataPath);
  }

  // Clamp a manually-edited uses value to [0, maxUses]
  function onUsesEdited(value) {
    const itemDataPath = dataPath.replace(".data.usesRemaining", "");
    const maxUses = parseInt(api.getValue(`${itemDataPath}.data.maxUses`), 10);
    const uses = parseInt(value, 10);
    if (isNaN(uses)) return;
    let clamped = uses;
    if (clamped < 0) clamped = 0;
    if (!isNaN(maxUses) && clamped > maxUses) clamped = maxUses;
    if (clamped !== uses) {
      api.setValue(`${itemDataPath}.data.usesRemaining`, clamped);
    }
  }

  // Recharge a charged item's uses (Has Use, not Consumable).
  // - A dice recharge value (e.g. "1d6") is rolled via the itemRecharge
  //   handler and added to current uses, capped at Max Uses.
  // - A fixed number (e.g. "1") adds exactly that many uses, capped at Max Uses.
  // - No value recharges the item to full.
  function rechargeItem() {
    // Shared with the grid popover's Recharge button; implementation lives in
    // commonScript (rechargeInventoryItem).
    const itemDataPath = dataPath.replace(".data.rechargeBtn", "");
    rechargeInventoryItem(itemDataPath);
  }

  // Update attributes if needed
  // updateAttributes / onItemEquippedFor / onItemAttunedFor now live in
  // commonScript (rollhandlers/common.js) so the item row and the grid
  // Equip/Attune actions share one implementation.

  function onItemAttuned() {
    onItemAttunedFor(dataPath.replace(".data.attuned", ""));
  }

  // Then update AC calculation in character-main.html and getArmorClassForToken
  // When an item's count changes: if it's ammo, push the new count to every
  // weapon linked to it; if it's a thrown weapon, sync its own ammo to the count.
  // Also recompute carried weight (the count field's prior onchange behavior).
  function onCountChange(value) {
    const itemDataPath = dataPath.replace(".data.count", "");
    const item = api.getValue(itemDataPath);
    const isAmmo = item?.data?.subtype === "Ammunition";
    const isThrown = (item?.data?.weaponProperties || []).includes("Thrown");

    const valuesToSet = {};
    const inventory = record?.data?.inventory || [];

    // Fold the weight recompute into the same setValues (compute-only, no write)
    // so it ships in one round-trip — mirrors onItemEquipped / Level Up's pattern
    // and avoids the race of a separate setTotalWeight() after api.setValues().
    const totalWeight = setTotalWeight(false);
    if (totalWeight !== record?.data?.totalWeight) {
      valuesToSet["data.totalWeight"] = totalWeight;
    }

    if (isAmmo) {
      inventory.forEach((invItem, index) => {
        if (invItem.data?.ammoSelect === item._id) {
          valuesToSet[`data.inventory.${index}.data.ammo`] = value;
        }
      });
    } else if (isThrown) {
      valuesToSet[`${itemDataPath}.data.ammo`] = value;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onItemEquipped() {
    onItemEquippedFor(dataPath.replace(".data.carried", ""), value);
  }
</script>

<!-- The use controls (Use / Uses / Recharge) live in TWO slots: inline between
     the attune button and Location on a wide window, and on a second line when
     the record window is <= 600px (the `md` tier). The client's ambient
     rvtt-hide-md / rvtt-show-md utilities pick which slot renders — they query
     the record window's own width via the `sheet` container, so no JS is
     involved. Both slots bind the same field names, so the existing
     usesGroup / rechargeBtn hidden writes in character-inventory.html drive
     both. The tier classes go on plain wrapper divs, never on the <box> itself:
     rvtt-show-md resolves to `display: revert !important`, which would override
     the box's own hidden state and force an empty box visible. -->
<div style="display: flex; flex-direction: column; width: 100%; gap: 2px">
<div
  style="
    min-height: 30px;
    display: flex;
    gap: 4px;
    align-items: center;
    width: 100%;
  "
>
  <div style="width: 30px; min-width: 30px">
    <portrait width="30px" height="30px" name="portrait"></portrait>
  </div>
  <div style="width: 60px">
    <numberfield
      size="xs"
      variant="tooltip"
      label="Count"
      width="100%"
      field="count"
      placeholder="0"
      onchange="onCountChange(value)"
    ></numberfield>
  </div>
  <div style="min-width: 50px; flex-grow: 1">
    <namefield
      size="xs"
      variant="standard"
      width="100%"
      placeholder="Item"
      field="namefield"
      updateonblur="true"
    />
  </div>
  <iconbutton
    hidden="true"
    size="sm"
    field="attuned"
    variant="default"
    options='[{"icon": "IconDiamondOff", "label": "Not Attuned", "value": "false"}, {"icon": "IconDiamond", "label": "Attuned", "value": "true"}]'
    onchange="onItemAttuned()"
    onclick=""
  ></iconbutton>
  <!-- Use button: ALWAYS inline, immediately left of Location. It costs only
       ~46px, so it fits at any width a sheet is usable at, and it's the piece
       nearly every consumable shows. The button sits directly in the flex row
       rather than in a wrapper div, so when it's hidden (display:none) the row
       contributes no stray gap. -->
  <button
    hidden="true"
    size="xxs"
    radius="xs"
    width="40px"
    field="useBtn"
    onclick="useItem()"
    label="Use"
  ></button>
  <!-- Uses counter + Recharge: the ~150px cluster that genuinely can't share a
       narrow row. Inline above the md tier, second line at/below it. -->
  <div class="rvtt-hide-md" style="display: contents">
    <box field="usesGroup" hidden="true">
      <div
        style="
          display: flex;
          flex-direction: row;
          gap: 4px;
          align-items: center;
        "
      >
        <div style="width: 52px">
          <numberfield
            size="xs"
            variant="tooltip"
            label="Uses"
            width="100%"
            field="usesRemaining"
            placeholder="0"
            min="0"
            onchange="onUsesEdited(value)"
          ></numberfield>
        </div>
        <label field="usesMaxLabel" size="xxs" color="dimmed"></label>
        <button
          hidden="true"
          size="xxs"
          radius="xs"
          width="70px"
          field="rechargeBtn"
          onclick="rechargeItem()"
          label="Recharge"
          color="secondary"
        ></button>
      </div>
    </box>
  </div>
  <div style="width: 100px; min-width: 100px">
    <stringfield
      width="100%"
      size="xs"
      variant="tooltip-underline"
      label="Location"
      field="location"
      placeholder="Enter Location..."
      updateonblur="true"
    >
    </stringfield>
  </div>
  <div style="width: 95px; min-width: 95px">
    <dropdown
      size="xs"
      field="carried"
      variant="default"
      width="100%"
      defaultvalue="carried"
      disablediflocked="false"
      options='[{"label": "Carried", "value": "carried"}, {"label": "Equipped", "value": "equipped"}, {"label": "Dropped", "value": "dropped"}]'
      onchange="onItemEquipped()"
    ></dropdown>
  </div>
</div>

<!-- Second line: ONLY the counter + Recharge cluster, and only for charged
     items on a narrow window. The <box> is outermost so that items with no
     charges drop out entirely (display:none) rather than leaving an empty
     block behind. The tier class sits on a bare wrapper with no layout of its
     own: rvtt-show-md resolves to `display: revert !important`, which would
     clobber a display:flex on that same element, so the flex row is a child. -->
<box field="usesGroup" hidden="true">
  <div class="rvtt-show-md">
    <div
      style="
        display: flex;
        flex-direction: row;
        gap: 4px;
        align-items: center;
        justify-content: flex-end;
      "
    >
      <!-- Plain bold text, not an rvtt sheet label. Only the second-line slot
           carries it: inline, the row is tight and the numberfield's own
           tooltip label already covers it. -->
      <span
        style="font-weight: 700; font-size: var(--mantine-font-size-xs, 12px)"
        >Uses</span
      >
      <div style="width: 52px">
        <numberfield
          size="xs"
          variant="tooltip"
          label="Uses"
          width="100%"
          field="usesRemaining"
          placeholder="0"
          min="0"
          onchange="onUsesEdited(value)"
        ></numberfield>
      </div>
      <label field="usesMaxLabel" size="xxs" color="dimmed"></label>
      <button
        hidden="true"
        size="xxs"
        radius="xs"
        width="70px"
        field="rechargeBtn"
        onclick="rechargeItem()"
        label="Recharge"
        color="secondary"
      ></button>
    </div>
  </div>
</box>
</div>
